version: '3.8'

services:
  webmail:
    build:
      context: .
      dockerfile: Dockerfile
    image: afterlogic-webmail:latest
    container_name: afterlogic_webmail
    restart: unless-stopped
    ports:
      - "9000:80"
    volumes:
      - ./data:/var/www/html/data
    environment:
      - TZ=Asia/Dhaka
    networks:
      - mailnet

networks:
  mailnet:
    driver: bridge
