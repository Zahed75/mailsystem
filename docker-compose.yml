version: '3.8'

services:
  roundcube:
    image: roundcube/roundcubemail:latest
    container_name: roundcube_webmail
    restart: unless-stopped
    ports:
      - "127.0.0.1:8888:80"
    environment:
      - ROUNDCUBEMAIL_DEFAULT_HOST=ssl://156.67.216.209
      - ROUNDCUBEMAIL_DEFAULT_PORT=993
      - ROUNDCUBEMAIL_SMTP_SERVER=tls://156.67.216.209
      - ROUNDCUBEMAIL_SMTP_PORT=587
      - ROUNDCUBEMAIL_UPLOAD_MAX_FILESIZE=50M
      - ROUNDCUBEMAIL_SKIN=elastic
    volumes:
      - ./roundcube-data:/var/www/html
      - ./roundcube-db:/var/roundcube/db
    networks:
      - mailnet

networks:
  mailnet:
    driver: bridge
