version: '3.8'

services:
  snappymail:
    image: djmaze/snappymail:latest
    container_name: snappymail_webmail
    restart: always
    ports:
      - "127.0.0.1:8888:8888" # Only expose to localhost (Nginx will proxy)
    volumes:
      - ./data:/var/lib/snappymail
    environment:
      - TZ=Asia/Dhaka
    networks:
      - mailnet
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8888" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Optional: Add Nginx in Docker (alternative to system Nginx)
  nginx:
    image: nginx:alpine
    container_name: snappymail_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - snappymail
    networks:
      - mailnet

networks:
  mailnet:
    driver: bridge
